<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Le Pass d'un Instant — Merci !</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Lato', sans-serif;
    background: #FAF7F2;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
    text-align: center;
  }
  .logo { width: 100px; height: 100px; object-fit: contain; margin-bottom: 1.2rem; }
  h1 { font-family: 'Playfair Display', serif; font-size: 1.8rem; color: #5C3D2E; margin-bottom: 0.3rem; }
  h1 span { color: #C0392B; font-style: italic; }
  .card {
    background: white;
    border: 1px solid #DDD0C0;
    border-radius: 16px;
    padding: 2rem 1.5rem;
    max-width: 420px;
    width: 100%;
    margin: 1.5rem 0;
  }
  .check { font-size: 3rem; margin-bottom: 1rem; }
  .card h2 { font-family: 'Playfair Display', serif; font-size: 1.3rem; color: #5C3D2E; margin-bottom: 0.8rem; }
  .card p { font-size: 0.9rem; color: #8B6050; line-height: 1.7; }
  .btn {
    display: block;
    width: 100%;
    max-width: 420px;
    padding: 0.9rem;
    background: #5C3D2E;
    color: white;
    font-family: 'Lato', sans-serif;
    font-size: 0.95rem;
    font-weight: 700;
    border-radius: 12px;
    text-decoration: none;
    margin-top: 0.8rem;
    transition: background 0.2s;
  }
  .btn:hover { background: #8B6050; }
  .btn-outline {
    background: transparent;
    color: #5C3D2E;
    border: 1.5px solid #DDD0C0;
  }
  .btn-outline:hover { background: #FAF7F2; }
</style>
</head>
<body>

<img src="https://i.ibb.co/kVvc3HVt/logo-Le-Pass-Dun-Instant.png" alt="Logo" class="logo">
<h1>Le pass d'un <span>instant</span></h1>

<div class="card">
  <div class="check">🎉</div>
  <h2>Votre e-ticket a été généré !</h2>
  <p>Merci pour votre achat. Présentez votre e-ticket chez nos partenaires pour profiter de vos avantages et remises jusqu'à -30%.</p>
</div>

<a href="https://lepassduninstant.fr" class="btn">🌐 Visiter notre site</a>
<a href="https://lepassduninstant-max.github.io/lepassduninstant/" class="btn btn-outline" style="margin-top:0.8rem;">📱 Télécharger l'application</a>

<p style="font-size:0.72rem;color:#A0745A;margin-top:1rem;">Bientôt disponible sur App Store et Google Play</p>

</body>
</html>
