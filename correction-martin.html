<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Correction Martin</title></head>
<body>
<p id="msg">Cliquez pour corriger</p>
<button onclick="go()">Corriger Martin & Cow</button>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({apiKey:"AIzaSyAyxBcBBypSrspnc_5RcLmhR2RuVwPa5ZQ",authDomain:"pass-instant.firebaseapp.com",projectId:"pass-instant"});
var db=firebase.firestore();
async function go(){
  var snap=await db.collection('partenaires').get();
  snap.forEach(async function(d){
    if((d.data().name||'').includes('Martin')){
      await db.collection('partenaires').doc(d.id).update({description:"Bar à fromage et charcuterie fine / Bar à vin"});
      document.getElementById('msg').textContent='✅ Corrigé !';
    }
  });
}
</script></body></html>
