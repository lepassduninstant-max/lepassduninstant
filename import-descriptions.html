function log(msg, cls) {
  var el = document.getElementById('log');
  var d = document.createElement('div');
  if (cls) d.className = cls;
  d.textContent = msg;
  el.appendChild(d);
  el.scrollTop = el.scrollHeight;
}

async function lancer() {
  var btn = document.getElementById('btn');
  btn.disabled = true;
  log('Chargement Firebase...', 'info');
  
  var snap = await db.collection('partenaires').get();
  var docs = {};
  snap.forEach(function(d) { docs[d.data().name] = d.id; });
  log(Object.keys(docs).length + ' partenaires chargés', 'ok');
  
  var names = Object.keys(DESCRIPTIONS);
  var ok = 0, warn = 0;
  
  for (var i = 0; i < names.length; i++) {
    var name = names[i];
    var desc = DESCRIPTIONS[name];
    document.getElementById('bar').style.width = Math.round((i+1)/names.length*100) + '%';
    
    var docId = docs[name];
    if (docId) {
      await db.collection('partenaires').doc(docId).update({ description: desc });
      log('✅ ' + name, 'ok');
      ok++;
    } else {
      log('⚠️ Non trouvé: ' + name, 'warn');
      warn++;
    }
    await new Promise(function(r) { setTimeout(r, 200); });
  }
  
  log('=== TERMINÉ — ✅ ' + ok + ' mis à jour, ⚠️ ' + warn + ' non trouvés ===', 'info');
  btn.textContent = 'Terminé !';
}
