<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Fix Sensation Large</title></head>
<body>
<p id="msg">Cliquez pour corriger</p>
<button onclick="go()">Corriger Sensation Large</button>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({apiKey:"AIzaSyAyxBcBBypSrspnc_5RcLmhR2RuVwPa5ZQ",authDomain:"pass-instant.firebaseapp.com",projectId:"pass-instant"});
var db=firebase.firestore();
async function go(){
  try{
    var snap=await db.collection('partenaires').get();
    var found=false;
    snap.forEach(async function(d){
      if((d.data().code||'')==='SENSATIONLARGE2026' && !found){
        found=true;
        await db.collection('partenaires').doc(d.id).update({name:"Sensation Large"});
        document.getElementById('msg').textContent='✅ '+d.data().name+' → Sensation Large';
      }
    });
    setTimeout(function(){
      if(!found) document.getElementById('msg').textContent='⚠️ Code SENSATIONLARGE2026 non trouvé';
    }, 1000);
  }catch(e){
    document.getElementById('msg').textContent='Erreur: '+e.message;
  }
}
</script></body></html>
