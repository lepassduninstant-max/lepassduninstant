<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Château des Lumières</title></head>
<body>
<p id="msg">Cliquez pour corriger</p>
<button onclick="go()">Corriger Château des Lumières</button>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({apiKey:"AIzaSyAyxBcBBypSrspnc_5RcLmhR2RuVwPa5ZQ",authDomain:"pass-instant.firebaseapp.com",projectId:"pass-instant"});
var db=firebase.firestore();
async function go(){
  try{
    // Trouver le premier document avec code CHATEAULUMIE2026 et le renommer
    var snap=await db.collection('partenaires').get();
    var found=false;
    snap.forEach(async function(d){
      if((d.data().code||'')==='CHATEAULUMIE2026' && !found){
        found=true;
        await db.collection('partenaires').doc(d.id).update({name:"Château des Lumières"});
        document.getElementById('msg').textContent='✅ Premier partenaire renommé: '+d.data().name+' → Château des Lumières';
      }
    });
    if(!found) document.getElementById('msg').textContent='⚠️ Aucun partenaire trouvé avec ce code';
  }catch(e){
    document.getElementById('msg').textContent='Erreur: '+e.message;
  }
}
</script></body></html>
