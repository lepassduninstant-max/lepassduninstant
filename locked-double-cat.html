<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Locked double catégorie</title>
<style>body{font-family:sans-serif;max-width:600px;margin:20px auto;padding:20px;background:#FAF6F1;}.log{background:#fff;border:1px solid #ddd;border-radius:8px;padding:12px;height:300px;overflow-y:auto;font-size:12px;font-family:monospace;margin:12px 0;}button{background:#3D2B1F;color:#fff;border:none;padding:12px 20px;border-radius:8px;font-size:14px;cursor:pointer;}button:disabled{opacity:0.5;}.ok{color:green;}.info{color:blue;}.warn{color:orange;}</style>
</head><body>
<h1>🔒 Locked + Cabine Mystère — Intérieur ET Insolite</h1>
<p>Pour chaque entrée existante, crée une copie dans l'autre catégorie.</p>
<div class="log" id="log"><div class="info">Prêt.</div></div>
<button id="btn" onclick="lancer()">▶ Lancer</button>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({apiKey:"AIzaSyAyxBcBBypSrspnc_5RcLmhR2RuVwPa5ZQ",authDomain:"pass-instant.firebaseapp.com",projectId:"pass-instant",storageBucket:"pass-instant.firebasestorage.app",messagingSenderId:"234758483474",appId:"1:234758483474:web:7d739963a99a7bd573f2cb"});
var db=firebase.firestore();
function log(msg,cls){var el=document.getElementById('log');var d=document.createElement('div');if(cls)d.className=cls;d.textContent=msg;el.appendChild(d);el.scrollTop=el.scrollHeight;}
async function lancer(){
  var btn=document.getElementById('btn');btn.disabled=true;
  log('Chargement Firebase...','info');
  var snap=await db.collection('partenaires').get();
  var locked=[];
  snap.forEach(function(d){
    var name=(d.data().name||'').toLowerCase();
    if(name.includes('locked')||name.includes('cabine myst')){
      locked.push({id:d.id,...d.data()});
    }
  });
  log(locked.length+' entrées Locked/Cabine trouvées','info');
  
  var ok=0;
  for(var i=0;i<locked.length;i++){
    var p=locked[i];
    var autrecat=p.cat==='insolite'?'indoor':'insolite';
    
    // Vérifier si la copie existe déjà
    var exists=locked.some(function(x){
      return x.name===p.name && x.zone===p.zone && x.cat===autrecat;
    });
    
    if(!exists){
      var copie=Object.assign({},p);
      delete copie.id;
      copie.cat=autrecat;
      await db.collection('partenaires').add(copie);
      log('✅ Copie ajoutée: '+p.name+' ('+autrecat+') zone:'+p.zone,'ok');
      ok++;
    }else{
      log('✓ Déjà présent: '+p.name+' ('+autrecat+')','warn');
    }
    await new Promise(function(r){setTimeout(r,300);});
  }
  log('=== TERMINÉ — '+ok+' copies créées ===','info');
  btn.textContent='Terminé !';
}
</script></body></html>
