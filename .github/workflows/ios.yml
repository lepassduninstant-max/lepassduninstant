name: Build and Deploy iOS

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    
    - name: Install Capacitor
      run: |
        npm install -g @capacitor/cli
        npm install @capacitor/core @capacitor/ios
    
    - name: Setup project
      run: |
        npx cap init "Le Pass d'un Instant" "fr.lepassduninstant.app" --web-dir www || true
        mkdir -p www
        curl -o www/index.html https://lepassduninstant-max.github.io/lepassduninstant/
        npx cap add ios || true
        npx cap sync ios

    - name: Set app icon
      run: |
        python3 -m pip install pillow --break-system-packages
        curl -o icon-1024.png https://raw.githubusercontent.com/lepassduninstant-max/lepassduninstant/main/icon-1024.png
        python3 set_icon.py
        cat > ios/App/App/Assets.xcassets/AppIcon.appiconset/Contents.json << 'EOF'
        {
          "images": [
            {"filename": "Icon-20@2x.png", "idiom": "iphone", "scale": "2x", "size": "20x20"},
            {"filename": "Icon-20@3x.png", "idiom": "iphone", "scale": "3x", "size": "20x20"},
            {"filename": "Icon-29@2x.png", "idiom": "iphone", "scale": "2x", "size": "29x29"},
            {"filename": "Icon-29@3x.png", "idiom": "iphone", "scale": "3x", "size": "29x29"},
            {"filename": "Icon-40@2x.png", "idiom": "iphone", "scale": "2x", "size": "40x40"},
            {"filename": "Icon-40@3x.png", "idiom": "iphone", "scale": "3x", "size": "40x40"},
            {"filename": "Icon-60@2x.png", "idiom": "iphone", "scale": "2x", "size": "60x60"},
            {"filename": "Icon-60@3x.png", "idiom": "iphone", "scale": "3x", "size": "60x60"},
            {"filename": "Icon-76.png", "idiom": "ipad", "scale": "1x", "size": "76x76"},
            {"filename": "Icon-76@2x.png", "idiom": "ipad", "scale": "2x", "size": "76x76"},
            {"filename": "Icon-83.5@2x.png", "idiom": "ipad", "scale": "2x", "size": "83.5x83.5"},
            {"filename": "Icon-1024.png", "idiom": "ios-marketing", "scale": "1x", "size": "1024x1024"}
          ],
          "info": {"author": "xcode", "version": 1}
        }
        EOF
    - name: Fix iPad orientations
      run: |
        /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations~ipad" ios/App/App/Info.plist || true
        /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad array" ios/App/App/Info.plist
        /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad:0 string UIInterfaceOrientationPortrait" ios/App/App/Info.plist
        /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad:1 string UIInterfaceOrientationPortraitUpsideDown" ios/App/App/Info.plist
        /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad:2 string UIInterfaceOrientationLandscapeLeft" ios/App/App/Info.plist
        /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad:3 string UIInterfaceOrientationLandscapeRight" ios/App/App/Info.plist

    - name: Set build number
      run: |
        /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 14" ios/App/App/Info.plist
        echo "Build number: 14"

    - name: Fix Pods signing
      run: |
        cd ios/App
        sed -i '' 's/post_install do |installer|/post_install do |installer|\n    installer.pods_project.targets.each do |target|\n      target.build_configurations.each do |config|\n        config.build_settings["CODE_SIGNING_ALLOWED"] = "NO"\n        config.build_settings["CODE_SIGNING_REQUIRED"] = "NO"\n      end\n    end/' Podfile
        pod install

    - name: Install certificates
      env:
        CERTIFICATE_BASE64: ${{ secrets.CERTIFICATE_BASE64 }}
        PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
      run: |
        echo "$CERTIFICATE_BASE64" | base64 --decode > certificate.cer
        echo "$PRIVATE_KEY" | base64 --decode > private.key
        echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > profile.mobileprovision
        mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
        cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/
        openssl x509 -inform DER -in certificate.cer -out certificate.pem
        openssl rsa -in private.key -out private.pem
        openssl pkcs12 -export -out certificate.p12 -inkey private.pem -in certificate.pem -passout pass:"test"
        security create-keychain -p "" build.keychain
        security import certificate.p12 -k build.keychain -P "test" -A
        security list-keychains -s build.keychain
        security default-keychain -s build.keychain
        security unlock-keychain -p "" build.keychain
        security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain

    - name: Select Xcode 26
      run: sudo xcode-select -s /Applications/Xcode_26.0.app/Contents/Developer

    - name: Build iOS
      run: |
        cd ios/App
        xcodebuild -workspace App.xcworkspace \
          -scheme App \
          -configuration Release \
          -archivePath $RUNNER_TEMP/App.xcarchive \
          archive \
          -destination "generic/platform=iOS" \
          CODE_SIGN_STYLE=Manual \
          CODE_SIGN_IDENTITY="Apple Distribution" \
          DEVELOPMENT_TEAM="YDVHWA9LU8" \
          PROVISIONING_PROFILE_SPECIFIER="LePassDunInstant_Distribution" \
          OTHER_CODE_SIGN_FLAGS="--keychain build.keychain"

    - name: Export IPA
      run: |
        xcodebuild -exportArchive \
          -archivePath $RUNNER_TEMP/App.xcarchive \
          -exportPath $RUNNER_TEMP/export \
          -exportOptionsPlist ExportOptions.plist

    - name: Upload to App Store Connect
      env:
        APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      run: |
        mkdir -p ~/.appstoreconnect/private_keys
        echo "$APP_STORE_CONNECT_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_$APP_STORE_CONNECT_KEY_ID.p8
        xcrun altool --upload-app \
          -f $RUNNER_TEMP/export/App.ipa \
          -t ios \
          --apiKey $APP_STORE_CONNECT_KEY_ID \
          --apiIssuer $APP_STORE_CONNECT_ISSUER_ID
