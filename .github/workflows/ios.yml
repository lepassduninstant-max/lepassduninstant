name: Build and Deploy iOS

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    
    - name: Install Capacitor
      run: |
        npm install -g @capacitor/cli
        npm install @capacitor/core @capacitor/ios
    
    - name: Setup project
      run: |
        npx cap init "Le Pass d'un Instant" "fr.lepassduninstant.app" --web-dir www || true
        mkdir -p www
        curl -o www/index.html https://lepassduninstant-max.github.io/lepassduninstant/
        npx cap add ios || true
        npx cap sync ios
