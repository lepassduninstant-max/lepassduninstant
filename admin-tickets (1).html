<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Le Pass d'un Instant</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Lato', sans-serif; background: #FAF7F2; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 2rem 1rem; }
  .logo { width: 80px; height: 80px; object-fit: contain; margin-bottom: 1rem; }
  h1 { font-family: 'Playfair Display', serif; font-size: 1.6rem; color: #5C3D2E; margin-bottom: 0.3rem; }
  h1 span { color: #C0392B; font-style: italic; }
  .badge-admin { background: #5C3D2E; color: white; font-size: 0.72rem; font-weight: 700; padding: 3px 12px; border-radius: 999px; letter-spacing: 0.08em; margin-bottom: 2rem; }

  /* LOGIN */
  #login-area { width: 100%; max-width: 380px; }
  .card { background: white; border: 1px solid #DDD0C0; border-radius: 16px; padding: 2rem; width: 100%; }
  .card h2 { font-family: 'Playfair Display', serif; font-size: 1.1rem; color: #5C3D2E; margin-bottom: 1.2rem; }
  label { display: block; font-size: 0.78rem; font-weight: 700; color: #8B6050; text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 0.35rem; }
  input, select { width: 100%; padding: 0.65rem 0.9rem; border: 1px solid #DDD0C0; border-radius: 8px; font-family: 'Lato', sans-serif; font-size: 0.95rem; color: #3A2A1A; background: #FAF7F2; outline: none; margin-bottom: 1rem; }
  input:focus, select:focus { border-color: #8B6050; background: white; }
  .btn { width: 100%; padding: 0.85rem; background: #5C3D2E; color: white; font-family: 'Lato', sans-serif; font-size: 0.95rem; font-weight: 700; border: none; border-radius: 10px; cursor: pointer; }
  .btn:hover { background: #8B6050; }
  .btn-red { background: #C0392B; }
  .btn-red:hover { background: #a93226; }
  .error { color: #C0392B; font-size: 0.85rem; margin-top: 0.5rem; }

  /* ADMIN */
  #admin-area { display: none; width: 100%; max-width: 480px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  .field { margin-bottom: 1rem; }

  /* TICKET */
  #ticket-area { display: none; width: 100%; max-width: 380px; margin-top: 1.5rem; }
  .ticket { background: white; border: 2px solid #5C3D2E; border-radius: 16px; padding: 2rem 1.6rem 1.6rem; position: relative; overflow: hidden; }
  .ticket::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 6px; background: linear-gradient(90deg, #5C3D2E, #C9A84C, #5C3D2E); }
  .ticket-header { text-align: center; margin-bottom: 1.2rem; }
  .ticket-logo { width: 60px; height: 60px; object-fit: contain; margin-bottom: 0.5rem; }
  .ticket-title { font-family: 'Playfair Display', serif; font-size: 1.2rem; color: #5C3D2E; }
  .ticket-title span { color: #C0392B; font-style: italic; }
  .ticket-etiquette { font-size: 1rem; letter-spacing: 0.2em; text-transform: uppercase; color: #5C3D2E; font-weight: 700; margin-top: 0.3rem; }
  .ticket-divider { border: none; border-top: 1px dashed #DDD0C0; margin: 1rem 0; }
  .ticket-row { display: flex; justify-content: space-between; margin-bottom: 0.75rem; font-size: 0.92rem; }
  .t-label { color: #A0745A; font-weight: 300; min-width: 130px; }
  .t-value { font-weight: 700; color: #3A2A1A; text-align: right; }
  .ticket-dates-box { background: #FAF7F2; border: 1px solid #DDD0C0; border-radius: 10px; padding: 0.9rem 1rem; margin: 1rem 0; }
  .dates-title { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: #A0745A; margin-bottom: 0.6rem; }
  .dates-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
  .date-cell { text-align: center; }
  .dc-label { font-size: 0.7rem; color: #A0745A; text-transform: uppercase; letter-spacing: 0.05em; }
  .dc-value { font-family: 'Playfair Display', serif; font-size: 1.1rem; color: #5C3D2E; font-weight: 600; }
  .ticket-persons-badge { display: inline-block; background: #5C3D2E; color: white; font-size: 0.85rem; font-weight: 700; padding: 0.4rem 1rem; border-radius: 999px; margin: 0.5rem 0 1rem; }
  .ticket-qr-area { text-align: center; margin: 1rem 0 0.5rem; }
  .ticket-qr-area p { font-size: 0.78rem; color: #A0745A; margin-top: 0.5rem; line-height: 1.5; }
  .ticket-footer { text-align: center; font-size: 0.75rem; color: #A0745A; margin-top: 1rem; padding-top: 1rem; border-top: 1px solid #DDD0C0; }
</style>
</head>
<body>

<img src="https://i.ibb.co/kVvc3HVt/logo-Le-Pass-Dun-Instant.png" alt="Logo" class="logo">
<h1>Le pass d'un <span>instant</span></h1>
<div class="badge-admin">ESPACE ADMIN</div>

<!-- LOGIN -->
<div id="login-area">
  <div class="card">
    <h2>Connexion</h2>
    <div class="field">
      <label>Mot de passe</label>
      <input type="password" id="mdp" placeholder="••••••••••">
    </div>
    <button class="btn" onclick="login()">Se connecter</button>
    <p class="error" id="login-error"></p>
  </div>
</div>

<!-- ADMIN -->
<div id="admin-area">
  <div class="card">
    <h2>Générer un E-Ticket</h2>
    <div class="row">
      <div class="field">
        <label>Nom</label>
        <input type="text" id="nom" placeholder="Dupont">
      </div>
      <div class="field">
        <label>Prénom</label>
        <input type="text" id="prenom" placeholder="Marie">
      </div>
    </div>
    <div class="field">
      <label>Nom du gîte / hébergement</label>
      <input type="text" id="gite" placeholder="Le temps d'un instant">
    </div>
    <div class="field">
      <label>Nombre de personnes</label>
      <select id="nb-personnes">
        <option value="2">2 personnes — 5 €</option>
        <option value="4">4 personnes — 10 €</option>
        <option value="6" selected>6 personnes — 15 €</option>
        <option value="8">8 personnes — 20 €</option>
        <option value="10">10 personnes — 25 €</option>
        <option value="12">12 personnes — 30 €</option>
      </select>
    </div>
    <div class="field">
      <label>Date de début (laisser vide = aujourd'hui)</label>
      <input type="date" id="date-debut">
    </div>
    <button class="btn" onclick="genererTicket()">Générer le ticket</button>
  </div>

  <!-- TICKET -->
  <div id="ticket-area">
    <div class="ticket" id="ticket">
      <div class="ticket-header">
        <img src="https://i.ibb.co/kVvc3HVt/logo-Le-Pass-Dun-Instant.png" class="ticket-logo" alt="Logo">
        <div class="ticket-title">Le pass d'un <span>instant</span></div>
        <div class="ticket-etiquette">E-Ticket</div>
      </div>
      <hr class="ticket-divider">
      <div class="ticket-row"><span class="t-label">Nom :</span><span class="t-value" id="t-nom"></span></div>
      <div class="ticket-row"><span class="t-label">Prénom :</span><span class="t-value" id="t-prenom"></span></div>
      <div class="ticket-row"><span class="t-label">Hébergement :</span><span class="t-value" id="t-gite"></span></div>
      <div class="ticket-dates-box">
        <div class="dates-title">Validité du pass — 7 jours</div>
        <div class="dates-grid">
          <div class="date-cell"><div class="dc-label">Valable du</div><div class="dc-value" id="t-debut"></div></div>
          <div class="date-cell"><div class="dc-label">Au</div><div class="dc-value" id="t-fin"></div></div>
        </div>
      </div>
      <div><div id="t-nb-badge" class="ticket-persons-badge"></div></div>
      <hr class="ticket-divider">
      <div class="ticket-qr-area">
        <img src="https://i.ibb.co/CpbRPvyS/qrcode-Pass-d-un-instant-site.png" alt="QR Code" style="width:130px;height:130px;">
        <p>Accédez à nos nombreux partenaires<br>en scannant ce QR code</p>
      </div>
      <div class="ticket-footer">Ou rendez-vous sur notre site : <a href="https://lepassduninstant.fr" style="color:#C0392B;font-weight:700;text-decoration:none;">lepassduninstant.fr</a></div>
    </div>
    <button class="btn" style="margin-top:1rem;" onclick="telecharger()">⬇ Télécharger le ticket</button>
    <button class="btn btn-red" style="margin-top:0.5rem;" onclick="reset()">Générer un autre ticket</button>
  </div>
</div>

<script>
function login() {
  var mdp = document.getElementById('mdp').value;
  if (mdp === '#Edesbi1987') {
    document.getElementById('login-area').style.display = 'none';
    document.getElementById('admin-area').style.display = 'block';
  } else {
    document.getElementById('login-error').textContent = 'Mot de passe incorrect.';
  }
}

function formatDate(date) {
  var d = String(date.getDate()).padStart(2, '0');
  var m = String(date.getMonth() + 1).padStart(2, '0');
  var y = date.getFullYear();
  return d + '/' + m + '/' + y;
}

function genererTicket() {
  var nom = document.getElementById('nom').value.trim();
  var prenom = document.getElementById('prenom').value.trim();
  var gite = document.getElementById('gite').value.trim();
  var nb = document.getElementById('nb-personnes').value;
  var dateInput = document.getElementById('date-debut').value;

  if (!nom || !prenom || !gite) {
    alert('Veuillez remplir nom, prénom et gîte.');
    return;
  }

  var today = dateInput ? new Date(dateInput + 'T12:00:00') : new Date();
  var expiry = new Date(today);
  expiry.setDate(today.getDate() + 7);

  document.getElementById('t-nom').textContent = nom.toUpperCase();
  document.getElementById('t-prenom').textContent = prenom;
  document.getElementById('t-gite').textContent = gite;
  document.getElementById('t-debut').textContent = formatDate(today);
  document.getElementById('t-fin').textContent = formatDate(expiry);
  document.getElementById('t-nb-badge').textContent = nb + ' personnes';

  document.getElementById('ticket-area').style.display = 'block';
  document.getElementById('ticket-area').scrollIntoView({ behavior: 'smooth' });
}

function telecharger() {
  var ticket = document.getElementById('ticket');
  html2canvas(ticket, { scale: 2, backgroundColor: '#ffffff', useCORS: true }).then(function(canvas) {
    var link = document.createElement('a');
    link.download = 'eticket-admin.png';
    link.href = canvas.toDataURL('image/png');
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  });
}

function reset() {
  document.getElementById('ticket-area').style.display = 'none';
  document.getElementById('nom').value = '';
  document.getElementById('prenom').value = '';
  document.getElementById('gite').value = '';
  document.getElementById('date-debut').value = '';
}

document.getElementById('mdp').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') login();
});
</script>
</body>
</html>
