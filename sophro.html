<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Supprimer doublon Sophro</title>
<style>body{font-family:sans-serif;max-width:600px;margin:20px auto;padding:20px;background:#FAF6F1;}.log{background:#fff;border:1px solid #ddd;border-radius:8px;padding:12px;height:300px;overflow-y:auto;font-size:12px;font-family:monospace;margin:12px 0;}button{background:#C0392B;color:#fff;border:none;padding:12px 20px;border-radius:8px;font-size:14px;cursor:pointer;}button:disabled{opacity:0.5;}.ok{color:green;}.info{color:blue;}.warn{color:orange;}</style>
</head><body>
<h1>🗑️ Supprimer doublon Sophro Balade</h1>
<div class="log" id="log"><div class="info">Prêt.</div></div>
<button id="btn" onclick="lancer()">▶ Afficher toutes les Sophro Balade</button>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({apiKey:"AIzaSyAyxBcBBypSrspnc_5RcLmhR2RuVwPa5ZQ",authDomain:"pass-instant.firebaseapp.com",projectId:"pass-instant",storageBucket:"pass-instant.firebasestorage.app",messagingSenderId:"234758483474",appId:"1:234758483474:web:7d739963a99a7bd573f2cb"});
var db=firebase.firestore();
function log(msg,cls){var el=document.getElementById('log');var d=document.createElement('div');if(cls)d.className=cls;d.innerHTML=msg;el.appendChild(d);el.scrollTop=el.scrollHeight;}
async function supprimer(id,name){
  if(!confirm('Supprimer: '+name+'?'))return;
  await db.collection('partenaires').doc(id).delete();
  log('✅ Supprimé: '+name,'ok');
}
async function lancer(){
  document.getElementById('btn').disabled=true;
  var snap=await db.collection('partenaires').get();
  var count=0;
  snap.forEach(function(d){
    var name=d.data().name||'';
    if(name.toLowerCase().includes('sophro')){
      var p=d.data();
      log((++count)+'. <b>'+name+'</b> | Zone: '+p.zone+' | <button onclick="supprimer(''+d.id+'',''+name+'')">🗑️ Supprimer</button>','');
    }
  });
  if(count===0)log('Aucune Sophro trouvée','warn');
  else log(count+' entrées trouvées','info');
}
</script></body></html>
