<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Correction descriptions</title>
<style>body{font-family:sans-serif;max-width:600px;margin:20px auto;padding:20px;background:#FAF6F1;}.log{background:#fff;border:1px solid #ddd;border-radius:8px;padding:12px;height:300px;overflow-y:auto;font-size:12px;font-family:monospace;margin:12px 0;}button{background:#3D2B1F;color:#fff;border:none;padding:12px 20px;border-radius:8px;font-size:14px;cursor:pointer;}button:disabled{opacity:0.5;}.bar-wrap{height:8px;background:#eee;border-radius:4px;margin:8px 0;}.bar{height:8px;background:#C4A882;border-radius:4px;width:0;}.ok{color:green;}.info{color:blue;}.warn{color:orange;}</style>
</head><body>
<h1>📝 Correction descriptions — 9 partenaires</h1>
<div class="bar-wrap"><div class="bar" id="bar"></div></div>
<div class="log" id="log"><div class="info">Prêt.</div></div>
<button id="btn" onclick="lancer()">▶ Corriger</button>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({apiKey:"AIzaSyAyxBcBBypSrspnc_5RcLmhR2RuVwPa5ZQ",authDomain:"pass-instant.firebaseapp.com",projectId:"pass-instant",storageBucket:"pass-instant.firebasestorage.app",messagingSenderId:"234758483474",appId:"1:234758483474:web:7d739963a99a7bd573f2cb"});
var db=firebase.firestore();
var CORRECTIONS=[{"contains": "Revisiter", "description": "Food truck cuisine de produits locaux"}, {"contains": "Escap'Ane", "description": "Balade avec un âne ou à dos d'âne pour les plus petits"}, {"contains": "Max Guide", "description": "Sortie nature en Baie de Somme, traversée de la baie"}, {"contains": "Filles et leur", "description": "Boutique de vêtements et bijoux"}, {"contains": "Baie de Somme Exploration", "description": "Chasse au trésor et jeux de pistes"}, {"contains": "Balade Nautique", "description": "Sortie bateau en voilier"}, {"contains": "Ma'Douceur", "description": "Massage au cabinet ou à domicile"}, {"contains": "Guinguette de Petit Port", "description": "Guinguette le long du canal de la Somme"}, {"contains": "Espace Bien-Être Château", "description": "Privatisation d'un jacuzzi au cœur du parc du château"}];
function log(msg,cls){var el=document.getElementById('log');var d=document.createElement('div');if(cls)d.className=cls;d.textContent=msg;el.appendChild(d);el.scrollTop=el.scrollHeight;}

async function lancer(){
  var btn=document.getElementById('btn');btn.disabled=true;
  log('Chargement Firebase...','info');
  var snap=await db.collection('partenaires').get();
  var ok=0;
  
  for(var i=0;i<CORRECTIONS.length;i++){
    var c=CORRECTIONS[i];
    document.getElementById('bar').style.width=Math.round((i+1)/CORRECTIONS.length*100)+'%';
    log('Recherche: '+c.contains,'info');
    var count=0;
    snap.forEach(async function(d){
      var name=d.data().name||'';
      if(name.toLowerCase().includes(c.contains.toLowerCase())){
        await db.collection('partenaires').doc(d.id).update({description:c.description});
        log('  ✅ '+name,'ok');
        count++;ok++;
      }
    });
    await new Promise(function(r){setTimeout(r,500);});
    if(count===0) log('  ⚠️ Aucun trouvé pour: '+c.contains,'warn');
  }
  
  setTimeout(function(){
    log('=== TERMINÉ — '+ok+' fiches mises à jour ===','info');
    btn.textContent='Terminé !';
  },2000);
}
</script></body></html>
