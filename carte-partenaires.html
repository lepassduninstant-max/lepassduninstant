<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Carte des partenaires — Le Pass d'un Instant</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #FAF6F1; }

    #header {
      background: #C4A882;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    #header h1 {
      font-size: 18px;
      color: #3D2B1F;
      font-weight: 700;
    }
    #header p {
      font-size: 12px;
      color: #7A5C42;
    }

    #map {
      width: 100%;
      height: calc(100vh - 60px);
    }

    #legend {
      position: absolute;
      top: 70px;
      right: 10px;
      z-index: 500;
      background: rgba(255,255,255,0.95);
      border-radius: 10px;
      padding: 8px 6px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-height: calc(100vh - 120px);
      overflow-y: auto;
      scrollbar-width: none;
    }
    #legend::-webkit-scrollbar { display: none; }

    .filter-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 8px;
      border-radius: 8px;
      border: 1.5px solid transparent;
      background: transparent;
      font-size: 11px;
      color: #3D2B1F;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
      text-align: left;
    }
    .filter-btn.active {
      background: #3D2B1F;
      color: #fff;
    }
    .filter-btn:hover { background: #EDE5DC; }
    .filter-btn.active:hover { background: #3D2B1F; }
    .filter-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(255,255,255,0.95);
      padding: 20px 30px;
      border-radius: 12px;
      font-size: 14px;
      color: #3D2B1F;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      z-index: 1000;
    }

    #count-badge {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #3D2B1F;
      color: #fff;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 12px;
      z-index: 500;
      pointer-events: none;
    }
  </style>
</head>
<body>

<div id="header">
  <div>
    <h1>Carte des partenaires</h1>
    <p>Le Pass d'un Instant · Baie de Somme</p>
  </div>
</div>

<div style="position:relative;">
  <div id="legend">
    <button class="filter-btn active" data-cat="all" onclick="filterCat('all', this)">
      <span class="filter-dot" style="background:#3D2B1F"></span>Tous
    </button>
    <button class="filter-btn" data-cat="restauration" onclick="filterCat('restauration', this)">
      <span class="filter-dot" style="background:#E53935"></span>Restauration
    </button>
    <button class="filter-btn" data-cat="nature" onclick="filterCat('nature', this)">
      <span class="filter-dot" style="background:#1B5E20"></span>Nature
    </button>
    <button class="filter-btn" data-cat="commerces" onclick="filterCat('commerces', this)">
      <span class="filter-dot" style="background:#1E88E5"></span>Commerces
    </button>
    <button class="filter-btn" data-cat="insolite" onclick="filterCat('insolite', this)">
      <span class="filter-dot" style="background:#8E24AA"></span>Insolites
    </button>
    <button class="filter-btn" data-cat="indoor" onclick="filterCat('indoor', this)">
      <span class="filter-dot" style="background:#FB8C00"></span>Intérieur
    </button>
    <button class="filter-btn" data-cat="bienetre" onclick="filterCat('bienetre', this)">
      <span class="filter-dot" style="background:#26A69A"></span>Bien-être
    </button>
    <button class="filter-btn" data-cat="voyageur" onclick="filterCat('voyageur', this)">
      <span class="filter-dot" style="background:#E91E63"></span>Services
    </button>
    <button class="filter-btn" data-cat="bonus" onclick="filterCat('bonus', this)">
      <span class="filter-dot" style="background:#A0522D"></span>Bonus
    </button>
  </div>

  <div id="loading">⏳ Chargement des partenaires...</div>
  <div id="map"></div>
  <div id="count-badge">0 partenaire</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyAyxBcBBypSrspnc_5RcLmhR2RuVwPa5ZQ",
  authDomain: "pass-instant.firebaseapp.com",
  projectId: "pass-instant",
  storageBucket: "pass-instant.firebasestorage.app",
  messagingSenderId: "234758483474",
  appId: "1:234758483474:web:7d739963a99a7bd573f2cb"
});
const db = getFirestore(app);

const CATS = {
  restauration: { color: "#E53935", ico: '<path d="M3 2v7c0 1.1.9 2 2 2h2v11h2V11h2a2 2 0 002-2V2h-2v5H7V2H5v5H3V2H1v7c0 1.1.9 2 2 2"/><path d="M19 2c-1.66 0-3 1.34-3 3v5h2v11h2V2h-1z"/>' },
  nature:       { color: "#1B5E20", ico: '<path d="M12 22V12M12 12C12 7 7 3 3 3c0 5 3 9 9 9zM12 12c0-5 5-9 9-9-1 5-4 9-9 9"/>' },
  commerces:    { color: "#1E88E5", ico: '<path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4zM3 6h18M16 10a4 4 0 01-8 0"/>' },
  insolite:     { color: "#8E24AA", ico: '<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>' },
  indoor:       { color: "#FB8C00", ico: '<path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>' },
  bienetre:     { color: "#26A69A", ico: '<circle cx="12" cy="12" r="10"/><path d="M12 2a10 10 0 010 20 5 5 0 010-10 5 5 0 000-10"/>' },
  voyageur:     { color: "#E91E63", ico: '<path d="M5 17H3a2 2 0 01-2-2V9a2 2 0 012-2h1l2-4h10l2 4h1a2 2 0 012 2v6a2 2 0 01-2 2h-2M5 17h14M5 17a2 2 0 100 4 2 2 0 000-4zm14 0a2 2 0 100 4 2 2 0 000-4z"/>' },
  bonus:        { color: "#A0522D", ico: '<circle cx="12" cy="8" r="6"/><path d="M12 14l-4 8h8l-4-8z"/>' },
};

// Init carte
const map = L.map('map').setView([50.18, 1.62], 10);
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
  attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> © CARTO',
  subdomains: 'abcd', maxZoom: 19
}).addTo(map);

let allMarkers = [];
let currentCat = 'all';

function makeIcon(cat, hasFlash) {
  const c = CATS[cat] || { color: '#3D2B1F', ico: '<circle cx="12" cy="10" r="3"/>' };
  const bg = hasFlash ? '#C0392B' : c.color;
  const size = hasFlash ? 36 : 30;
  return L.divIcon({
    className: '',
    html: `<div style="width:${size}px;height:${size}px;background:${bg};border:2.5px solid #fff;border-radius:50%;box-shadow:0 2px 8px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;">
      <svg viewBox="0 0 24 24" width="${Math.round(size*0.55)}px" height="${Math.round(size*0.55)}px" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${c.ico}</svg>
    </div>`,
    iconSize: [size, size],
    iconAnchor: [size/2, size],
    popupAnchor: [0, -size]
  });
}

function updateCount() {
  const visible = allMarkers.filter(m => m._visible).length;
  const badge = document.getElementById('count-badge');
  badge.textContent = visible + (visible <= 1 ? ' partenaire' : ' partenaires');
}

window.filterCat = function(cat, btn) {
  currentCat = cat;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  allMarkers.forEach(m => {
    if (cat === 'all' || m._cat === cat) {
      m.addTo(map);
      m._visible = true;
    } else {
      map.removeLayer(m);
      m._visible = false;
    }
  });
  updateCount();
};

let flashOffers = [];

// Chargement flash
onSnapshot(collection(db, 'flash'), (snap) => {
  flashOffers = [];
  const now = Date.now();
  snap.forEach(d => {
    const f = { id: d.id, ...d.data() };
    let expMs = null;
    if (f.expiresAt) {
      if (f.expiresAt.toMillis) expMs = f.expiresAt.toMillis();
      else if (f.expiresAt.toDate) expMs = f.expiresAt.toDate().getTime();
    }
    if (!expMs || expMs > now) flashOffers.push(f);
  });
});

// Chargement partenaires
onSnapshot(collection(db, 'partenaires'), (snap) => {
  // Supprimer anciens markers
  allMarkers.forEach(m => map.removeLayer(m));
  allMarkers = [];

  snap.forEach(d => {
    const p = { id: d.id, ...d.data() };
    if (!p.coords || !p.coords[0]) return;

    const hasFlash = flashOffers.some(f => f.partenaireId === p.id || f.partenaireNom === p.name);
    const gmUrl = `https://www.google.com/maps/dir/?api=1&destination=${p.coords[0]},${p.coords[1]}`;
    const catColor = (CATS[p.cat] || {}).color || '#3D2B1F';

    const popup = `<div style="font-family:-apple-system,sans-serif;min-width:170px;max-width:230px;">
      <div style="display:flex;align-items:center;gap:6px;margin-bottom:6px;">
        <div style="width:10px;height:10px;border-radius:50%;background:${catColor};flex-shrink:0;"></div>
        <div style="font-weight:700;font-size:13px;color:#3D2B1F;">${p.name || ''}</div>
      </div>
      ${p.avantage ? `<div style="font-size:11px;color:#C0392B;font-weight:600;margin-bottom:4px;">🎟 ${p.avantage}</div>` : ''}
      ${p.zone ? `<div style="font-size:11px;color:#8A6A50;margin-bottom:8px;">📍 ${p.zone}</div>` : ''}
      ${hasFlash ? `<div style="background:#FFF3CD;border:1px solid #FFD700;border-radius:6px;padding:4px 8px;font-size:11px;color:#856404;margin-bottom:8px;">⚡ Offre flash en cours !</div>` : ''}
      <a href="${gmUrl}" target="_blank" style="display:block;text-align:center;background:#4285F4;color:#fff;border-radius:6px;padding:6px 10px;font-size:11px;text-decoration:none;font-weight:600;">🗺 Y aller</a>
    </div>`;

    const marker = L.marker(p.coords, { icon: makeIcon(p.cat, hasFlash) })
      .bindPopup(popup, { maxWidth: 230 });

    marker._cat = p.cat;
    marker._visible = true;

    if (currentCat === 'all' || p.cat === currentCat) {
      marker.addTo(map);
    } else {
      marker._visible = false;
    }

    allMarkers.push(marker);
  });

  document.getElementById('loading').style.display = 'none';
  updateCount();
});
</script>
</body>
</html>
